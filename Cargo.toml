[workspace]
resolver = "2"
members = [
    "crates/pallet-core",
    "crates/pallet-cli",
    "crates/pallet-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Pallet contributors"]
repository = "https://github.com/stackryze/StackCrate"
rust-version = "1.85"

[profile.release]
lto = true
strip = true
codegen-units = 1
