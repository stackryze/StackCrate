[workspace]
resolver = "2"
members = [
    "crates/stackcrate-core",
    "crates/stackcrate-cli",
    "crates/stackcrate-daemon",
    "crates/stackcrate-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["StackCrate contributors"]
repository = "https://github.com/stackryze/StackCrate"
rust-version = "1.85"

[profile.release]
lto = true
strip = true
codegen-units = 1
