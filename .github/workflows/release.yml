name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install GTK4/libadwaita headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Derive version from tag (vX.Y.Z -> X.Y.Z)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches workspace version
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$cargo_version" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.ver.outputs.version }} does not match workspace.package.version $cargo_version in Cargo.toml"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Build .deb packages
        run: ./packaging/debian/build-deb.sh "${{ steps.ver.outputs.version }}" amd64 dist

      - name: Build binary tarball
        run: |
          mkdir -p dist dist-tarball
          target/release/gen-man dist-tarball
          target/release/gen-completions dist-tarball
          tar -czf "dist/stackcrate-${{ steps.ver.outputs.version }}-x86_64-linux-gnu.tar.gz" \
            -C target/release crate stackcrate-daemon stackcrate-gui \
            -C "$PWD/dist-tarball" crate.1 crate.bash _crate crate.fish crate.elv _crate.ps1

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Extract this version's changelog section
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            /^\[[0-9]+\.[0-9]+\.[0-9]+\]:/ { next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "StackCrate $GITHUB_REF_NAME" \
            --notes-file release-notes.md
