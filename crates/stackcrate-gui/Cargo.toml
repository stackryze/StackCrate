[package]
name = "stackcrate-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GTK4/libadwaita desktop frontend for StackCrate."

[[bin]]
name = "stackcrate-gui"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = "0.4.45"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stackcrate-core = { path = "../stackcrate-core" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
