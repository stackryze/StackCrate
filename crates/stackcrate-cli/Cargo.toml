[package]
name = "stackcrate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for StackCrate."

[[bin]]
name = "crate"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive", "wrap_help"] }
colored = "3.1.1"
dirs-next = "2.0.0"
stackcrate-core = { version = "0.1.0", path = "../stackcrate-core" }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
