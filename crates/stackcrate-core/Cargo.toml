[package]
name = "stackcrate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core package-source adapters, config, registry and verification for StackCrate."

[lib]
name = "stackcrate_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs-next = "2.0.0"
flate2 = "1.1.11"
hex = "0.4.3"
nix = { version = "0.32.0", features = ["user", "fs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
which = "8.0.6"
xz2 = { version = "0.1.7", features = ["static"] }
zip = "9.6.1"
