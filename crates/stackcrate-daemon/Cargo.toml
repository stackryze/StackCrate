[package]
name = "stackcrate-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Background update-monitoring daemon for StackCrate."

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
notify = "8.2.2"
notify-debouncer-mini = { version = "0.7.0", default-features = false }
notify-rust = "4.19.0"
stackcrate-core = { path = "../stackcrate-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
